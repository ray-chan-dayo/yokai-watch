services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: development
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    command: npm run dev
    env_file:
      - path: ./api/.env
        required: false
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres@db:5432/development
      TEST_DATABASE_URL: postgresql://postgres@db_test:5432/test
    volumes:
      - ./api/src:/app/src
      - ./api/prisma:/app/prisma
      - ./api/tsconfig.json:/app/tsconfig.json
      - ./api/vitest.config.ts:/app/vitest.config.ts
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    command: npm run dev
    env_file:
      - path: ./web/.env
        required: false
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/next.config.ts:/app/next.config.ts
    depends_on:
      - api

volumes:
  db_data:
