<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="48" fill="#fff9e6"/>

  <!-- body -->
  <ellipse cx="256" cy="360" rx="120" ry="100" fill="#ffe066"/>

  <!-- head -->
  <circle cx="256" cy="210" r="120" fill="#ffe066"/>

  <!-- ears -->
  <ellipse cx="136" cy="210" rx="30" ry="40" fill="#ffe066"/>
  <ellipse cx="136" cy="210" rx="18" ry="26" fill="#ffb3b3"/>
  <ellipse cx="376" cy="210" rx="30" ry="40" fill="#ffe066"/>
  <ellipse cx="376" cy="210" rx="18" ry="26" fill="#ffb3b3"/>

  <!-- horns -->
  <polygon points="200,98 186,32 222,90" fill="#ff6b6b"/>
  <polygon points="312,98 326,32 290,90" fill="#ff6b6b"/>

  <!-- eyes white -->
  <ellipse cx="214" cy="200" rx="28" ry="32" fill="white"/>
  <ellipse cx="298" cy="200" rx="28" ry="32" fill="white"/>
  <!-- pupils -->
  <circle cx="220" cy="206" r="17" fill="#222"/>
  <circle cx="304" cy="206" r="17" fill="#222"/>
  <!-- eye shine -->
  <circle cx="226" cy="200" r="6" fill="white"/>
  <circle cx="310" cy="200" r="6" fill="white"/>

  <!-- eyebrows -->
  <path d="M188 164 Q214 150 240 164" stroke="#6b4c1e" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M272 164 Q298 150 324 164" stroke="#6b4c1e" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <ellipse cx="256" cy="232" rx="12" ry="8" fill="#f5b800"/>

  <!-- mouth -->
  <path d="M220 266 Q256 296 292 266" stroke="#c0392b" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="170" cy="240" rx="22" ry="14" fill="#ff9999" opacity="0.5"/>
  <ellipse cx="342" cy="240" rx="22" ry="14" fill="#ff9999" opacity="0.5"/>

  <!-- arms -->
  <ellipse cx="144" cy="362" rx="36" ry="24" fill="#ffe066" transform="rotate(-30 144 362)"/>
  <ellipse cx="368" cy="362" rx="36" ry="24" fill="#ffe066" transform="rotate(30 368 362)"/>

  <!-- belly -->
  <ellipse cx="256" cy="368" rx="72" ry="58" fill="#fff3b0"/>

  <!-- feet -->
  <ellipse cx="214" cy="454" rx="40" ry="26" fill="#ffe066"/>
  <ellipse cx="298" cy="454" rx="40" ry="26" fill="#ffe066"/>

  <!-- MOCK badge -->
  <rect x="18" y="18" width="96" height="36" rx="10" fill="#888" opacity="0.75"/>
  <text x="66" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white" font-weight="bold">MOCK</text>
</svg>
