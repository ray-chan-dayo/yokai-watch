<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#fff9e6"/>

  <!-- body -->
  <ellipse cx="100" cy="130" rx="52" ry="44" fill="#ffe066"/>

  <!-- head -->
  <circle cx="100" cy="82" r="46" fill="#ffe066"/>

  <!-- eyes -->
  <ellipse cx="84" cy="78" rx="10" ry="12" fill="white"/>
  <ellipse cx="116" cy="78" rx="10" ry="12" fill="white"/>
  <circle cx="86" cy="80" r="6" fill="#222"/>
  <circle cx="118" cy="80" r="6" fill="#222"/>
  <circle cx="88" cy="78" r="2" fill="white"/>
  <circle cx="120" cy="78" r="2" fill="white"/>

  <!-- eyebrows -->
  <path d="M74 64 Q84 58 94 64" stroke="#6b4c1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M106 64 Q116 58 126 64" stroke="#6b4c1e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <ellipse cx="100" cy="91" rx="5" ry="3" fill="#f5b800"/>

  <!-- mouth -->
  <path d="M86 102 Q100 114 114 102" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- horns -->
  <polygon points="78,40 70,14 88,36" fill="#ff6b6b"/>
  <polygon points="122,40 130,14 112,36" fill="#ff6b6b"/>

  <!-- ears -->
  <ellipse cx="54" cy="82" rx="12" ry="16" fill="#ffe066"/>
  <ellipse cx="54" cy="82" rx="7" ry="10" fill="#ffb3b3"/>
  <ellipse cx="146" cy="82" rx="12" ry="16" fill="#ffe066"/>
  <ellipse cx="146" cy="82" rx="7" ry="10" fill="#ffb3b3"/>

  <!-- arms -->
  <ellipse cx="56" cy="138" rx="14" ry="10" fill="#ffe066" transform="rotate(-30 56 138)"/>
  <ellipse cx="144" cy="138" rx="14" ry="10" fill="#ffe066" transform="rotate(30 144 138)"/>

  <!-- feet -->
  <ellipse cx="84" cy="170" rx="16" ry="10" fill="#ffe066"/>
  <ellipse cx="116" cy="170" rx="16" ry="10" fill="#ffe066"/>

  <!-- belly -->
  <ellipse cx="100" cy="138" rx="28" ry="22" fill="#fff3b0"/>

  <!-- MOCK label -->
  <rect x="10" y="10" width="60" height="22" rx="6" fill="#888" opacity="0.7"/>
  <text x="40" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">MOCK</text>
</svg>
